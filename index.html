<script>

  const showKofi = first && mode !== "p" && !late && total === 0 && !s.kofi[k + mode]; // あとから遊んだ日には出さない
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>きっぷで10<small>${mode === "d" ? `今日の5枚 #${dayNo(k)}` : late ? `#${dayNo(k)} あとから` : mode === "h" ? "上級：難所" : "練習"}</small></h1><span></span></header>
    <p class="big">${total === 0 ? "全部ヒントなしで通過！" : `${list.length}枚 通過（ヒント ${total}）`}</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    ${(() => { const nx = nextAch(s); return nx ? `<p class="achnext" id="achnext">🎯 あと${nx.left}${nx.unit}で「${nx.name}」</p>` : ""; })()}
    <div class="rlist">${list.map((key, j) => { const inf = info(key); return `<div><span class="x">${key}</span><span class="w"><b>${esc(rec.f[j] || "")}</b><br>${starStr(starsOf(rec.h[j]))} ${mode === "h" ? "難所" : LV[inf.t]}・式${inf.ways}通り</span></div>`; }).join("")}</div>
    ${late ? `<p class="note">あとから遊んだ日は、カレンダーに ↺ で残ります（連続の日には数えません）。</p><button class="main alt" id="go-cal">カレンダーへ</button>` : ""}
    ${mode !== "p" && !late ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🟩ヒントなし　🟨ヒント1回　🟧ヒント2回<br>次の5枚まで あと <b>${untilNext()}</b></p>` : ""}
    ${mode !== "p" ? `<button class="main" id="go-e">続けて遊ぶ：とことん${s.ebest ? `（ベスト ${s.ebest}枚）` : ""}</button>` : ""}
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：難所の3枚に挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">切符帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home;
  $("go-p").onclick = practiceMenu;
  if ($("go-e")) $("go-e").onclick = () => startRun("e");
  $("go-dex").onclick = () => dex();
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home()); // 画面を開いたまま0時を過ぎたら、翌日の上級は始めない
  if ($("go-cal")) $("go-cal").onclick = () => cal(k.slice(0, 7));
  if (mode !== "p" && !late) {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
}

function dex(sel) {
  const s = load(), got = ALL.filter((k) => k in s.dex).sort();
  const inf = sel ? info(sel) : null, mine = sel ? foundOf(s, sel) : [];
  const full = (k) => foundOf(s, k).length >= info(k).ways;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>切符帳<small>${got.length}/${ALL.length}枚・式を全部見つけた ${got.filter(full).length}</small></h1><span></span></header>
    ${inf ? `<div class="ticket"><div class="top"><span>${LV[inf.t]}</span><span>${starStr(s.dex[sel])}</span></div><div class="no">${sel}</div><div class="bot"><span>式 ${mine.length}/${inf.ways}</span><span>${inf.int ? "" : "分数が要る難所"}</span></div></div>
      <div class="forms">${inf.forms.map((f) => mine.includes(f) ? `<span class="got">${esc(f)}</span>` : `<span class="hid">？</span>`).join("")}</div>
      <button class="main" id="again">${mine.length >= inf.ways ? "もう一度通る" : "この切符で別の式をさがす"}</button>`
      : `<p class="note">通った切符が集まります（緑は★3、「全」は式を全部見つけた切符）。切符を押すと、見つけた式と別解さがしができます。</p>`}
    <div class="dex">${got.map((k) => `<button data-k="${k}" class="s${s.dex[k]}${full(k) ? " all" : ""}" aria-label="${k.split("").join(" ")}">${k}</button>`).join("")}</div>
    ${got.length ? "" : `<p class="note">まだありません。今日の5枚か練習で集めましょう。</p>`}
    ${footer()}`;
  $("back").onclick = home;
  if ($("again")) $("again").onclick = () => startRun("p", sel);
  document.querySelectorAll(".dex button").forEach((b) => (b.onclick = () => { dex(b.dataset.k); window.scrollTo(0, 0); }));
  bindFooter();
}

function achView() {
  const s = load(), t = tally(s), got = achGot(s);
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${got.length}/${ACH.length}</small></h1><span></span></header>
    ${AGRP.map((g, gi) => `<p class="agrp">${g}</p><div class="alist">${ACH.filter((a) => a[3] === gi).map((a) => { const ok = got.includes(a[0]), n = Math.min(t[a[4]], a[5]); return `<div class="ach${ok ? " got" : ""}" data-id="${a[0]}"><span class="ic">🏅</span><b>${a[1]}</b><span class="pg">${ok ? "達成" : `${n}/${a[5]}`}</span><small>${a[2]}</small>${ok ? "" : `<span class="bar"><i style="width:${Math.round((n / a[5]) * 100)}%"></i></span>`}</div>`; }).join("")}</div>`).join("")}
    ${footer()}`;
  $("back").onclick = home;
  bindFooter(); window.scrollTo(0, 0);
}
// 遊んだ日のカレンダー：今日の5枚の日は★（ヒントの少なさ）で色を濃く、あとから遊んだ日は ↺、取りこぼした過去7日は押すとあとから遊べる
const ymOf = (k) => k.slice(0, 7);
const ymAdd = (ym, n) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const lvOf = (rec) => { const t = rec && Array.isArray(rec.h) ? rec.h.reduce((a, b) => a + b, 0) : 9; return t === 0 ? 3 : t <= 2 ? 2 : 1; };
function cal(ym) {
  const s = load(), k = todayKey(), late = lateDays(s, k), st = streak(s.days);
  if (!ym || ym > ymOf(k)) ym = ymOf(k);
  if (ym < ymOf(EPOCH)) ym = ymOf(EPOCH);
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), dow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const cells = [];
  for (let i = 0; i < dow; i++) cells.push(`<span class="c off"></span>`);
  for (let d = 1; d <= n; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, rec = s.days[key], ar = (s.adays || {})[key], hd = s.hdays[key] ? `<span class="hd">難</span>` : "";
    if (rec) { const lv = lvOf(rec); cells.push(`<span class="c p${lv}" data-k="${key}" aria-label="${m}月${d}日 星${lv}つ">${d}<i>${"★".repeat(lv)}</i>${hd}</span>`); }
    else if (ar) cells.push(`<span class="c late" data-k="${key}" aria-label="${m}月${d}日 あとから遊んだ">${d}<i>↺</i></span>`);
    else if (late.includes(key)) { const go = s.runs[runKey("a", key)]; cells.push(`<button class="c miss" data-k="${key}" aria-label="${m}月${d}日をあとから遊ぶ${go ? "（続きから）" : ""}">${d}<i>${go ? "続き" : "▶"}</i></button>`); }
    else cells.push(`<span class="c${key === k ? " today" : ""}" data-k="${key}">${d}</span>`);
  }
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>カレンダー${st >= 1 ? `<small>連続 ${st}日</small>` : ""}</h1><span></span></header>
    <div class="calnav"><button class="sub" id="prev" aria-label="前の月"${ym <= ymOf(EPOCH) ? " disabled" : ""}>‹</button><b>${y}年${m}月</b><button class="sub" id="next" aria-label="次の月"${ym >= ymOf(k) ? " disabled" : ""}>›</button></div>
    <div class="cal">${["日", "月", "火", "水", "木", "金", "土"].map((w) => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span><em style="background:#4f7d4a"></em>ヒントなし</span><span><em style="background:var(--tk2)"></em>ヒント1〜2</span><span>↺ あとから</span><span>難 上級</span></div>
    ${late.length ? `<p class="note">▶ の日は、その日の5枚をあとから遊べます（過去7日まで・連続の日には数えません）。</p>` : ""}
    ${footer()}`;
  $("back").onclick = home;
  $("prev").onclick = () => cal(ymAdd(ym, -1));
  $("next").onclick = () => cal(ymAdd(ym, 1));
  document.querySelectorAll(".cal .miss").forEach((b) => (b.onclick = () => (lateDays(load()).includes(b.dataset.k) ? startRun("a", b.dataset.k) : cal(ym)))); // 開いたまま0時を過ぎて8日前になった日は始めない
  bindFooter(); window.scrollTo(0, 0);
}

window.__kp = { mode: () => MODE, endlessList, ELIFE, ERAMP, runKey, D, ALL, info, dailyList, hardList, numberOf, handOf, starsOf, seedOf, todayKey, dayNo, shareText, streak, load, lateDays, ACH, achGot, nextAch, tally, canTen, cal, cur: () => cur, play: (m) => { if (m) MODE = m; play(); } };
home();
if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
