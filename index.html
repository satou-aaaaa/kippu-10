<style>

:root{

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.share{background:var(--paper);border-radius:12px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center;border:1px solid var(--line)}

.big{font-weight:900;font-size:26px;text-align:center;margin:0}
.rlist{display:flex;flex-direction:column;gap:8px}
.rlist div{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.rlist .x{font-family:var(--f-num);font-size:22px;letter-spacing:.12em;background:var(--tk);border:1px solid var(--tkline);border-radius:6px;padding:4px 8px}
.rlist .w{flex:1;font-size:13px;color:var(--ink2);line-height:1.5;min-width:0}
.rlist .w b{color:var(--ink);font-family:var(--f-num);font-size:16px;word-break:break-all}
/* 切符帳 */
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dex button{all:unset;cursor:pointer;min-height:44px;display:grid;place-items:center;border-radius:6px;font-family:var(--f-num);font-size:17px;letter-spacing:.06em;background:var(--card);border:1px solid var(--line);position:relative}
.dex button.s3{background:var(--tk);border-color:var(--tkline)}
.dex button.all::after{content:"全";position:absolute;right:2px;top:1px;font-size:9px;color:var(--red);font-family:var(--f-body);font-weight:900}
.lv{display:flex;gap:8px}
.lv button{flex:1}
.forms{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.forms span{font-family:var(--f-num);font-size:15px;background:#1d23200a;border-radius:6px;padding:4px 8px}
.forms span.got{background:var(--tk);border:1px solid var(--tkline)}
.forms span.hid{color:var(--ink2)}
dialog{border:none;border-radius:16px;background:var(--paper);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000aa}
dialog h2{margin:0 0 10px;letter-spacing:.1em}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}

dialog a{color:var(--red2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="wrap" id="app"></div>
<dialog id="howto" aria-labelledby="howto-t">
  <h2 id="howto-t">遊び方</h2>
  <ol>
    <li>切符の4つの数字を全部1回ずつ使って、10を作ります。</li>
    <li>数字を押す → ＋−×÷を押す → もう1つの数字を押すと、2つが1つの数になります。</li>
    <li>最後の1つが10になれば改札を通れます。並べかえ・かっこ（先に計算する順）は自由です。</li>
  </ol>
  <p>例：1・2・3・4 なら 1＋2＋3＋4＝10。とちゅうで分数やマイナスになってもかまいません。</p>
  <p>今日の5枚はだれでも同じで1日1回。時間制限はありません。</p>
  <p><a id="fb2" target="_blank" rel="noopener">感想を送る</a></p>
  <button class="main" id="howto-ok" style="width:100%">わかった</button>
</dialog>
<script src="ten.js"></script>
<script src="data.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id), app = $("app");
const SITE = "https://satou-aaaaa.github.io/kippu-10/";
const FEEDBACK = "https://github.com/satou-aaaaa/kippu-10/issues/new?template=feedback.yml";
const KEY = "kippu-v1", EPOCH = "2026-11-04";
const LV = ["やさしい", "ふつう", "むずかしい"];
const D = window.TEN_DATA, ALL = [...D.T[0], ...D.T[1], ...D.T[2]];
const info = (key) => { const a = D.S[key]; return { key, ways: a[0], int: !!a[1], sol: a[2], forms: a[3], t: D.T[0].includes(key) ? 0 : D.T[1].includes(key) ? 1 : 2 }; };

// ---- 日付と乱数（日本時間。だれでも同じ5枚）----
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const todayKey = () => jstNow().toISOString().slice(0, 10);
const dayNo = (k) => Math.round((Date.parse(k) - Date.parse(EPOCH)) / 864e5) + 1;
function seedOf(str) { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffled(arr, R) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// 難しさごとの組を、周ごとに混ぜた順で使う（1周するまで同じ組は出ない）
function nth(t, idx) { const pool = D.T[t], cyc = Math.floor(idx / pool.length); return shuffled(pool, rng(seedOf("cycle" + t + ":" + cyc)))[idx % pool.length]; }
const dayIdx = (k) => Math.max(0, dayNo(k) - 1);
// 今日の5枚：やさしい2・ふつう2・むずかしい1。上級：むずかしい3（むずかしいは1日4組ずつ使い、同じ日に重ならない）
const dailyList = (k) => [nth(0, dayIdx(k) * 2), nth(0, dayIdx(k) * 2 + 1), nth(1, dayIdx(k) * 2), nth(1, dayIdx(k) * 2 + 1), nth(2, dayIdx(k) * 4)];
const hardList = (k) => [1, 2, 3].map((j) => nth(2, dayIdx(k) * 4 + j));
// 切符に刷る番号：組の数字の並びは、日付と何枚目かで決まる（だれでも同じ）
const numberOf = (key, salt) => shuffled(key.split(""), rng(seedOf("no:" + key + ":" + salt))).join("");
const starsOf = (h) => (h === 0 ? 3 : h === 1 ? 2 : 1); // h = ヒントの数
const starStr = (s) => `<span class="stars" aria-label="星${s}つ">${"★".repeat(s)}<span class="off">${"★".repeat(3 - s)}</span></span>`;

// ---- 記録（この端末の localStorage だけ）----
// 進行中の遊びはモードごとに分けて持つ（練習を始めても今日・上級の途中経過を消さない）
// dex：組 → いちばんよい★、found：「組|式」→ 1（見つけた式）
const fresh = () => ({ v: 1, days: {}, hdays: {}, dex: {}, found: {}, runs: {}, tut: false, kofi: {} });
let MODE = "d";
let mem = null; // 保存できない環境では、開いているあいだだけここに置く
// 保存に失敗したあとはメモリと保存の両方を読む。記録（日ごとの結果・帳）は合わせて数は高いほう、途中経過は同じ日・同じ組なら進んだほう
function load() { let a = null, b = null; try { b = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} try { a = mem !== null ? JSON.parse(mem) : null; } catch (e) {} if (a && a.v !== 1) a = null; if (b && b.v !== 1) b = null; if (!a || !b) return Object.assign(fresh(), a || b || {}); const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a]; const s = Object.assign(fresh(), n); for (const k in o) { if (k === "runs" || k === "t") continue; const x = o[k], y = n[k]; if (x && y && typeof x === "object" && typeof y === "object") { s[k] = Object.assign({}, x, y); for (const q in x) if (typeof x[q] === "number" && typeof y[q] === "number") s[k][q] = Math.max(x[q], y[q]); } else if (typeof x === "number" && typeof y === "number") s[k] = Math.max(x, y); else if (x === true) s[k] = true; } const ra = a.runs || {}, rb = b.runs || {}, prog = (r) => (r.res ? r.res.length : 0) * 1000 + (r.cur && r.cur.steps ? r.cur.steps.length : 0), idOf = (r) => JSON.stringify(r.list || null); s.runs = Object.assign({}, n.runs); for (const m of new Set([...Object.keys(ra), ...Object.keys(rb)])) { const x = ra[m], y = rb[m]; if (!x || !y) continue; if (x.date !== y.date) s.runs[m] = x.date > y.date ? x : y; else if (idOf(x) === idOf(y)) s.runs[m] = prog(x) > prog(y) ? x : y; } return s; }
// 保存の前に読み直す（別のタブで進めた記録を消さない）
function save(fn) { const s = load(); fn(s); s.t = Math.max(Date.now(), (s.t || 0) + 1); const j = JSON.stringify(s); try { localStorage.setItem(KEY, j); mem = null; } catch (e) { mem = j; } return s; }
const prevDay = (k) => new Date(Date.parse(k) - 864e5).toISOString().slice(0, 10);
function streak(days) { let k = todayKey(), n = 0; if (!days[k]) k = prevDay(k); while (days[k]) { n++; k = prevDay(k); } return n; }
const RANKS = [[0, "見習い"], [10, "改札係"], [50, "車掌"], [150, "駅長"], [300, "運転指令"], [ALL.length, "全線制覇"]];
const rankOf = (n) => RANKS.filter((r) => n >= r[0]).pop()[1];
const nextRank = (n) => RANKS.find((r) => r[0] > n);
const foundOf = (s, key) => info(key).forms.filter((f) => s.found[key + "|" + f]);

// ---- 画面 ----
const md = (k) => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
const buzz = (n = 12) => { try { navigator.vibrate && navigator.vibrate(n); } catch (e) {} };
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const footer = () => `<footer><a href="#" id="f-how">遊び方</a><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a><a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi で応援</a></footer>`;
function bindFooter() { const h = $("f-how"); if (h) h.onclick = (e) => { e.preventDefault(); openHow(); }; }
function openHow() { $("fb2").href = FEEDBACK; const d = $("howto"); if (d.showModal) d.showModal(); else d.setAttribute("open", ""); }
$("howto-ok").onclick = () => { const d = $("howto"); d.close ? d.close() : d.removeAttribute("open"); save((s) => { s.tut = true; }); };
const ticketHtml = (no, top, bot, extra = "") => `<div class="ticket" role="img" aria-label="切符の番号 ${no.split("").join(" ")}"><div class="top"><span>${top}</span><span>乗車券</span></div><div class="no">${no}</div><div class="bot"><span>${bot}</span><span>10になれば通れます</span></div>${extra}</div>`;

function home() {
  const s = load(), k = todayKey(), done = s.days[k], hdone = s.hdays[k];
  // 最後の1枚を通して結果を見る前に閉じた日は、開き直したら結果へ進める（記録をつける）
  for (const m of ["d", "h"]) { const r = s.runs[m]; if (r && r.res.length >= r.list.length) { MODE = m; return finish(); } }
  const n = Object.keys(s.dex).length, nr = nextRank(n);
  const rd = s.runs.d && s.runs.d.date === k ? s.runs.d : null, rh = s.runs.h && s.runs.h.date === k ? s.runs.h : null;
  app.innerHTML = `
    <h1 class="title">きっぷで<span>10</span></h1>
    ${ticketHtml("1234", `第${dayNo(k)}日`, md(k) + " 発行")}
    <p class="lead">切符の4つの数字と ＋−×÷ で10を作る。<br>だれでも同じ1日5枚。</p>
    ${done ? `<div class="share">今日の結果　${done.h.map((h) => sq(h)).join("")}</div>` : ""}
    <button class="main" id="go-d">${done ? "今日の結果を見る" : rd ? `続きから（${rd.res.length + 1}枚目）` : `今日の5枚に挑む <small>#${dayNo(k)}</small>`}</button>
    ${done ? `<button class="main alt" id="go-h">${hdone ? "上級の結果を見る" : rh ? "上級の続きから" : "上級：難所の3枚（ヒントなし）"}</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習（何度でも）</button><button class="sub" id="go-dex">切符帳 ${n}/${ALL.length}</button></div>
    <div class="stats"><div><b>${streak(s.days)}</b><small>連続の日</small></div><div><b>${Object.keys(s.days).length}</b><small>遊んだ日</small></div><div><b>${Object.keys(s.found).length}</b><small>見つけた式</small></div></div>
    <p class="rank">称号：${rankOf(n)}${nr ? `（あと${nr[0] - n}枚で${nr[1]}）` : ""}</p>
    ${footer()}`;
  $("go-d").onclick = () => (done ? result("d", k) : startRun("d"));
  if ($("go-h")) $("go-h").onclick = () => (hdone ? result("h", k) : startRun("h"));
  $("go-p").onclick = practiceMenu;
  $("go-dex").onclick = () => dex();
  bindFooter();
  if (!s.tut) openHow();
}
function practiceMenu() {
  app.innerHTML = `<header><button class="icon" id="back" aria-label="もどる">←</button><h1>練習<small>今日の記録には入りません（切符帳には載ります）</small></h1><span></span></header>
    <p class="note">難しさを選ぶと3枚出ます。</p>
    <div class="lv">${LV.map((l, t) => `<button class="sub" data-t="${t}" style="min-height:64px">${l}</button>`).join("")}</div>
    <p class="note">切符帳の切符を押すと、同じ切符でちがう式（別解）をさがせます。</p>${footer()}`;
  $("back").onclick = home;
  document.querySelectorAll(".lv button").forEach((b) => (b.onclick = () => startRun("p", +b.dataset.t)));
  bindFooter();
}
function startRun(mode, opt) {
  const k = todayKey();
  save((s) => {
    if (mode !== "p" && s.runs[mode] && s.runs[mode].date === k) return; // 続きから
    let list;
    if (mode === "d") list = dailyList(k);
    else if (mode === "h") list = hardList(k);
    else if (typeof opt === "string") list = [opt];
    else { const pool = D.T[opt].slice(); for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; } list = pool.slice(0, 3); }
    s.runs[mode] = { mode, date: k, list, res: [], cur: null, id: Date.now() + "-" + Math.random().toString(36).slice(2, 8) };
  });
  MODE = mode;
  play();
}

// 今の1枚：{ i, date, key, no, hints, steps:[[a, op, b]]（手もとの何番目どうしを計算したか）, done }
let cur = null, pick = { a: null, op: null };
// 手もとの数を、最初の4つから手順どおりに計算し直す
function handOf(no, steps) {
  let hand = no.split("").map((d) => ({ v: TEN.fr(+d), e: TEN.leaf(d) }));
  for (const [a, op, b] of steps) {
    const x = hand[a], y = hand[b]; if (!x || !y || a === b) return null;
    const v = TEN.calc(x.v, op, y.v); if (!v) return null;
    const nx = hand.slice(); nx[b] = { v, e: TEN.exprOf(x.e, op, y.e) }; nx[a] = null; hand = nx;
  }
  return hand;
}
const live = (hand) => hand.filter(Boolean);
function play() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  const i = run.res.length;
  if (i >= run.list.length) return finish();
  const key = run.list[i], no = numberOf(key, run.mode === "p" ? run.id + ":" + i : run.date + ":" + run.mode + ":" + i), hard = run.mode === "h";
  // 途中で閉じても、計算の手順とヒントはそのまま
  const saved = run.cur && run.cur.i === i && run.cur.key === key ? run.cur : { steps: [], hints: 0 };
  cur = { i, date: run.date, id: run.id, key, no, hints: saved.hints, steps: (handOf(no, saved.steps) ? saved.steps : []).slice(), done: false };
  pick = { a: null, op: null };
  const inf = info(key), label = run.mode === "d" ? LV[inf.t] : run.mode === "h" ? "難所" : `練習・${LV[inf.t]}`;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="もどる">←</button>
      <div class="dots" aria-label="${i + 1}枚目／${run.list.length}枚">${run.list.map((_, j) => `<i class="${j < i ? "done" : j === i ? "on" : ""}"></i>`).join("")}</div>
      <span style="font-size:13px;color:var(--ink2)">${label} ${i + 1}/${run.list.length}</span></header>
    <div id="tk">${ticketHtml(no, run.mode === "d" ? `第${dayNo(run.date)}日 ${i + 1}枚目` : run.mode === "h" ? `第${dayNo(run.date)}日 難所` : "練習", label)}</div>
    <div class="cards" id="cards"></div>
    <div class="ops" id="ops">${TEN.OPS.map((o) => `<button class="op" data-op="${o}" aria-label="${{ "+": "たす", "-": "ひく", "×": "かける", "÷": "わる" }[o]}">${o === "-" ? "−" : o}</button>`).join("")}</div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="row"><button class="sub" id="undo">1つ戻す</button><button class="sub" id="reset">最初から</button>${hard ? "" : `<button class="sub" id="hint">ヒント</button>`}</div>
    <div id="hintbox"></div>
    <div id="after"></div>
    ${!s.tut || (Object.keys(s.dex).length === 0 && i === 0) ? `<p class="note">数字 → ＋−×÷ → 数字 の順に押すと、2つが1つになります。</p>` : ""}`;
  $("back").onclick = home;
  document.querySelectorAll(".op").forEach((b) => (b.onclick = () => chooseOp(b.dataset.op)));
  $("undo").onclick = undo; $("reset").onclick = reset;
  if ($("hint")) $("hint").onclick = hint;
  paint();
  window.scrollTo(0, 0);
}
const same = (r) => r && cur && r.date === cur.date && r.id === cur.id && r.res.length === cur.i && r.list[cur.i] === cur.key; // 保存した進み具合が、この画面と同じ切符か
function keep() { save((s) => { const r = s.runs[MODE]; if (same(r)) r.cur = { i: cur.i, key: cur.key, steps: cur.steps.map((x) => x.slice()), hints: cur.hints }; }); }
function paint() {
  const hand = handOf(cur.no, cur.steps);
  $("cards").innerHTML = hand.map((c, j) => c ? `<button class="cardn${c.v.d !== 1 ? " fracn" : ""}${pick.a === j ? " sel" : ""}" data-j="${j}" aria-label="${TEN.fstr(c.v)}" aria-pressed="${pick.a === j}">${TEN.fstr(c.v)}</button>` : `<button class="cardn gone" tabindex="-1" aria-hidden="true"></button>`).join("");
  document.querySelectorAll(".cardn[data-j]").forEach((b) => (b.onclick = () => chooseCard(+b.dataset.j)));
  document.querySelectorAll(".op").forEach((b) => { b.classList.toggle("sel", pick.op === b.dataset.op); b.disabled = cur.done; });
  const lines = []; let h = cur.no.split("").map((d) => TEN.fr(+d));
  for (const [a, op, b] of cur.steps) { const v = TEN.calc(h[a], op, h[b]); lines.push(`${TEN.fstr(h[a])} ${op === "-" ? "−" : op} ${TEN.fstr(h[b])} ＝ ${TEN.fstr(v)}`); h = h.slice(); h[b] = v; h[a] = null; }
  $("log").innerHTML = lines.length ? lines.map((l) => `<div>${esc(l)}</div>`).join("") : `<span class="ph">${pick.a == null ? "数字を押してください" : pick.op ? "もう1つの数字を押してください" : "＋−×÷を押してください"}</span>`;
  $("undo").disabled = !cur.steps.length || cur.done; $("reset").disabled = !cur.steps.length || cur.done;
  if ($("hint")) $("hint").disabled = cur.hints >= 2 || cur.done;
  const inf = info(cur.key);
  $("hintbox").innerHTML = cur.hints && !cur.done ? `<div class="hint">${inf.sol.slice(0, cur.hints).map((st, j) => `${j ? "つぎに" : "まず"} <b>${st[0]} ${st[1] === "-" ? "−" : st[1]} ${st[2]} ＝ ${st[3]}</b>`).join("<br>")}</div>` : "";
  if (!cur.done) { if (live(hand).length === 1) check(hand); else $("after").innerHTML = ""; }
}
function chooseCard(j) {
  if (cur.done) return;
  if (pick.a === j) { pick = { a: null, op: null }; return paint(); }
  if (pick.a == null || !pick.op) { pick = { a: j, op: null }; return paint(); }
  const hand = handOf(cur.no, cur.steps), v = TEN.calc(hand[pick.a].v, pick.op, hand[j].v);
  if (!v) { toast("0では割れません"); buzz(30); pick.op = null; return paint(); }
  cur.steps.push([pick.a, pick.op, j]); pick = { a: null, op: null }; buzz(); keep(); paint();
}
function chooseOp(op) {
  if (cur.done) return;
  if (pick.a == null) { toast("先に数字を押してください"); return; }
  pick.op = pick.op === op ? null : op; paint();
}
function undo() { if (cur.done || !cur.steps.length) return; cur.steps.pop(); pick = { a: null, op: null }; keep(); paint(); }
function reset() { if (cur.done || !cur.steps.length) return; cur.steps = []; pick = { a: null, op: null }; keep(); paint(); }
function hint() { if (cur.done || cur.hints >= 2) return; cur.hints++; keep(); paint(); toast(cur.hints === 1 ? "最初の計算を出しました" : "次の計算も出しました"); }
function check(hand) {
  const last = live(hand)[0];
  if (!(last.v.n === 10 && last.v.d === 1)) {
    const b = document.querySelector(".cardn[data-j]"); if (b) b.classList.add("bad");
    buzz(40);
    $("after").innerHTML = `<div class="near">${esc(TEN.show(last.e))} ＝ <b>${esc(TEN.fstr(last.v))}</b>。10になりませんでした。「1つ戻す」でやり直せます。</div>`;
    return;
  }
  $("after").innerHTML = "";
  // 正解：別のタブで先に進んでいたら、この画面の答えは入れない
  if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); }
  cur.done = true; buzz([10, 40, 10]);
  const form = TEN.show(last.e), inf = info(cur.key), st = starsOf(cur.hints), isNew = !load().found[cur.key + "|" + form];
  const s = save((s) => { const r = s.runs[MODE]; if (!same(r)) return; r.res.push({ h: cur.hints, f: form }); r.cur = null; s.dex[cur.key] = Math.max(s.dex[cur.key] || 0, st); s.found[cur.key + "|" + form] = 1; });
  const got = foundOf(s, cur.key).length;
  document.querySelector(".cardn[data-j]").classList.add("ten");
  $("tk").innerHTML = ticketHtml(cur.no, "改札済み", "", `<span class="stamp">通過</span>`);
  document.querySelectorAll(".op").forEach((b) => (b.disabled = true));
  $("undo").disabled = $("reset").disabled = true; if ($("hint")) $("hint").disabled = true;
  $("hintbox").innerHTML = "";
  const r = s.runs[MODE], fin = r && r.res.length >= r.list.length;
  $("after").innerHTML = `<div class="verdict" role="status">
    <div class="hd">通過！ ${starStr(st)}</div>
    <div class="formula">${esc(form)} ＝ 10</div>
    <p class="note">${!inf.int ? "分数を通らないと解けない難所でした。" : inf.ways === 1 ? "式が1通りしかない切符でした。" : `この切符の式は全部で${inf.ways}通り。見つけた式 ${got}/${inf.ways}${isNew && got > 1 ? "（新しい式！）" : ""}`}</p>
    <button class="main" id="next">${fin ? "結果を見る" : "次の切符へ"}</button></div>`;
  $("next").onclick = play;
  setTimeout(() => { if ($("next") && cur.done) $("next").scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 60);
}

function finish() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  let first = false;
  const rec = { h: run.res.map((r) => r.h), f: run.res.map((r) => r.f) };
  save((s2) => {
    if (run.mode === "d" && !s2.days[run.date]) { s2.days[run.date] = rec; first = true; }
    if (run.mode === "h" && !s2.hdays[run.date]) { s2.hdays[run.date] = rec; first = true; }
    s2.runs[MODE] = null;
  });
  if (run.mode === "p") return result("p", run.date, false, { list: run.list, ...rec });
  result(run.mode, run.date, first);
}
// 共有の文：切符の番号と式（答え）は出さない。ヒントの数だけ色を変える
const sq = (h) => (h === 0 ? "🟩" : h === 1 ? "🟨" : "🟧");
function shareText(mode, k, rec) {
  return `きっぷで10${mode === "h" ? " 難所" : ""} #${dayNo(k)} ${md(k)}\n🎫${rec.h.map(sq).join("")}${rec.h.every((h) => h === 0) ? " 全部ヒントなし" : ""}`;
}
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec) {
  const s = load();
  const list = mode === "p" ? prec.list : mode === "d" ? dailyList(k) : hardList(k);
  const rec = mode === "p" ? prec : (mode === "d" ? s.days : s.hdays)[k];
  if (!rec) return home();
  const total = rec.h.reduce((a, b) => a + b, 0), text = shareText(mode, k, rec);
  const showKofi = first && mode !== "p" && total === 0 && !s.kofi[k + mode];
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>きっぷで10<small>${mode === "d" ? `今日の5枚 #${dayNo(k)}` : mode === "h" ? "上級：難所" : "練習"}</small></h1><span></span></header>
    <p class="big">${total === 0 ? "全部ヒントなしで通過！" : `${list.length}枚 通過（ヒント ${total}）`}</p>
    <div class="rlist">${list.map((key, j) => { const inf = info(key); return `<div><span class="x">${key}</span><span class="w"><b>${esc(rec.f[j] || "")}</b><br>${starStr(starsOf(rec.h[j]))} ${mode === "h" ? "難所" : LV[inf.t]}・式${inf.ways}通り</span></div>`; }).join("")}</div>
    ${mode !== "p" ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🟩ヒントなし　🟨ヒント1回　🟧ヒント2回<br>次の5枚まで あと <b>${untilNext()}</b></p>` : ""}
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：難所の3枚に挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">切符帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home;
  $("go-p").onclick = practiceMenu;
  $("go-dex").onclick = () => dex();
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home()); // 画面を開いたまま0時を過ぎたら、翌日の上級は始めない
  if (mode !== "p") {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
}

function dex(sel) {
  const s = load(), got = ALL.filter((k) => k in s.dex).sort();
  const inf = sel ? info(sel) : null, mine = sel ? foundOf(s, sel) : [];
  const full = (k) => foundOf(s, k).length >= info(k).ways;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>切符帳<small>${got.length}/${ALL.length}枚・式を全部見つけた ${got.filter(full).length}</small></h1><span></span></header>
    ${inf ? `<div class="ticket"><div class="top"><span>${LV[inf.t]}</span><span>${starStr(s.dex[sel])}</span></div><div class="no">${sel}</div><div class="bot"><span>式 ${mine.length}/${inf.ways}</span><span>${inf.int ? "" : "分数が要る難所"}</span></div></div>
      <div class="forms">${inf.forms.map((f) => mine.includes(f) ? `<span class="got">${esc(f)}</span>` : `<span class="hid">？</span>`).join("")}</div>
      <button class="main" id="again">${mine.length >= inf.ways ? "もう一度通る" : "この切符で別の式をさがす"}</button>`
      : `<p class="note">通った切符が集まります（緑は★3、「全」は式を全部見つけた切符）。切符を押すと、見つけた式と別解さがしができます。</p>`}
    <div class="dex">${got.map((k) => `<button data-k="${k}" class="s${s.dex[k]}${full(k) ? " all" : ""}" aria-label="${k.split("").join(" ")}">${k}</button>`).join("")}</div>
    ${got.length ? "" : `<p class="note">まだありません。今日の5枚か練習で集めましょう。</p>`}
    ${footer()}`;
  $("back").onclick = home;
  if ($("again")) $("again").onclick = () => startRun("p", sel);
  document.querySelectorAll(".dex button").forEach((b) => (b.onclick = () => { dex(b.dataset.k); window.scrollTo(0, 0); }));
  bindFooter();
}

window.__kp = { mode: () => MODE, D, ALL, info, dailyList, hardList, numberOf, handOf, starsOf, seedOf, todayKey, dayNo, shareText, streak, load, cur: () => cur, play: (m) => { if (m) MODE = m; play(); } };
home();
if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
